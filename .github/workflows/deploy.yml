# Reusable workflow — call this from your project repo:
#
#   jobs:
#     docs:
#       uses: anishhs-gh/restyles/.github/workflows/deploy.yml@main
#       permissions:
#         contents: read
#         pages: write
#         id-token: write
#
name: ReStyles Deploy

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use
        required: false
        default: '20'
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout project repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Build ReStyles site
        run: npx github:anishhs-gh/restyles build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
