name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: find src bin -name '*.js' -exec node --check {} \;

      - name: Build bundle
        run: npm run build

      - name: Run tests
        run: npm test
